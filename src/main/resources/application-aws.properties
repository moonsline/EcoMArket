# Conexion directa a RDS (prueba rapida).
# NOTA: He asumido que el nombre de la base de datos en la instancia RDS es "ecomarket".
# Si tu base tiene otro nombre, reemplaza 'ecomarket' por el nombre correcto abajo.
spring.datasource.url=jdbc:oracle:thin:@devfullstack1_high?TNS_ADMIN=C:/WALLET
spring.datasource.username=ADMIN
spring.datasource.password=Desarrollofullstack1

# Para desarrollo: permite que hibernate cree/ajuste tablas (cambiar en produccion)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false

# Pool (Hikari por defecto)
spring.datasource.hikari.maximum-pool-size=10
